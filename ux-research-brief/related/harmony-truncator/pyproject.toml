[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harmony-truncator"
version = "0.1.0"
description = "Reproducible source-level ArkUI truncation mutation workbench"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "json5>=0.9"]

[project.scripts]
harmony-truncator = "truncator.__main__:main"

[tool.setuptools.packages.find]
include = ["truncator*"]

[tool.setuptools.package-data]
"truncator.source" = ["*.cjs"]
"truncator.review.reporting" = ["*.js"]
"truncator.mutation" = ["*.json"]
